[profile.default]
ignored_warnings_from = ["lib"]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
evm_version = "paris"

[profile.default.fuzz]
runs = 1024

[lint]
exclude_lints = [
    "unsafe-typecast",
    "unaliased-plain-import",
    "screaming-snake-case-const",
    "unused-return",
    "reentrancy-events",
]

[rpc_endpoints]
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
