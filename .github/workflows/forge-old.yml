name: forge-old

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-old:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
      - name: Install Foundry (old)
        run: |
          curl -fsSL -o foundry.tar.gz https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz
          echo "7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568  foundry.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/foundry"
          tar -xzf foundry.tar.gz -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: Install solc into svm cache
        run: |
          echo "0.8.21 f2857a898be15c69e8de5598dcd3f3e169e94964a0ce9a0bbb1b111f145a81df" |
          while read -r version sha256; do
            solc="$HOME/.svm/$version/solc-$version"
            mkdir -p "${solc%/*}"
            curl -fsSL -o "$solc" "https://github.com/ethereum/solidity/releases/download/v$version/solc-static-linux"
            echo "$sha256  $solc" | sha256sum -c -
            chmod +x "$solc"
          done
      - name: Run Forge tests
        run: forge test --offline
        env:
          ALCHEMY_KEY: ${{ secrets.PROTOCOL_ALCHEMY_KEY }}
