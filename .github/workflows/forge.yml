name: Forge

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.
      - name: Lint contracts and verification harnesses
        run: forge lint src --deny notes
      - name: Lint tests
        run: forge lint test --deny notes

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Check foundry.lock matches submodule pins
        run: forge build --locked

  check:
    permissions:
      contents: read
    name: forge-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.

      - name: Run Forge tests
        run: |
          forge test --deny warnings -vvv
        id: test
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}
          ALCHEMY_KEY: ${{ secrets.PROTOCOL_ALCHEMY_KEY }}

  fmt:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly # Catch upstream Foundry changes before the next stable release.

      - name: Check format
        run: forge fmt src test --check
